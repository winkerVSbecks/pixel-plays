<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cricket</title>
<style>
  :root { --ink: #1c1b19; --muted: #8b877f; --paper: #fff; --a: #2f4f86; --b: #3e7a56; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 13px/1.35 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; cursor: pointer; outline: none; }
  .hud { position: fixed; left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
  #scores { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); display: grid; gap: 2px; pointer-events: none; }
  #bottom { bottom: max(14px, env(safe-area-inset-bottom)); align-items: flex-end; }
  .team { display: flex; align-items: baseline; gap: 8px; }
  .team b { font-size: 16px; font-weight: 600; min-width: 2ch; font-variant-numeric: tabular-nums; }
  .team span { color: var(--muted); font-variant-numeric: tabular-nums; }
  #you { color: var(--a); } #rival { color: var(--b); }
  #status { color: var(--muted); text-wrap: balance; }
  #need, #over-row { color: var(--muted); font-variant-numeric: tabular-nums; }
  /* the result takes the need row at the top, clear of the shared credits at the bottom */
  #need.result { color: var(--ink); max-width: calc(100vw - 32px); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #over-row:not([hidden]) { display: flex; }
  /* this over, one mark per ball: · a dot ball, a number of runs, W a wicket */
  #this-over { display: flex; gap: .7ch; margin-left: 1ch; }
  #this-over .w { color: var(--ink); font-weight: 600; }
  button { pointer-events: auto; font: inherit; color: var(--muted); background: none; border: 0; padding: 10px; margin: -10px; cursor: pointer; }
  button:hover, button:focus-visible { color: var(--ink); }
  button:disabled { color: var(--muted); opacity: .45; cursor: default; }
  /* team picker: same chrome as the shell's rules popup (ink on white, 1px border, monospace) */
  #picker { width: min(420px, calc(100vw - 24px)); padding: 16px; border: 1px solid var(--ink); color: var(--ink); background: var(--paper); font: inherit; }
  #picker::backdrop { background: rgba(255, 255, 255, .72); }
  #picker h2 { margin: 0 0 4px; font: inherit; font-weight: 600; }
  #picker p { margin: 0 0 12px; color: var(--muted); }
  #picker #picker-new { color: var(--ink); }
  /* mid-match only: the way back to the match without a key, like the rules popup's Close */
  #picker-back { display: block; margin: 12px -10px -10px auto; color: var(--ink); touch-action: manipulation; }
  #picker-back[hidden] { display: none; }
  #teams { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  #teams button { display: grid; justify-items: center; gap: 6px; margin: 0; padding: 10px 4px 8px; color: var(--ink); border: 1px solid transparent; min-height: 64px; touch-action: manipulation; }
  #teams button:hover { border-color: var(--ink); }
  #teams button:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
  #teams button[aria-pressed="true"] { border-color: var(--ink); }
  /* the kit as a swatch: a solid chip of the team's shirt colour */
  .swatch { width: 30px; height: 22px; border: 1px solid var(--ink); background: var(--body); }
  .buttons { display: flex; gap: 20px; flex-shrink: 0; white-space: nowrap; }
  /* the touch aerial toggle, under the right thumb above the bottom bar and the credits (which step up to 72px on a
     narrow screen): armed, it reads as pressed (ink and paper swapped) until the ball is over */
  #loft { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(108px, calc(env(safe-area-inset-bottom) + 94px)); z-index: 5;
    margin: 0; padding: 8px 14px; border: 1px solid currentColor; background: var(--paper); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  #loft[aria-pressed="true"] { color: var(--paper); background: var(--ink); border-color: var(--ink); }
  #loft[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" tabindex="0" aria-label="Gully cricket in a lane with houses along both sides. You bat at the near end; the bowler runs in from the far end. Hold the arrow keys to aim, then press Space to hit along the ground or Shift+Space to hit in the air; or point and click, with Shift to hit in the air. On a touch screen, tap around the batter, and press aerial first to hit in the air."></canvas></div>
<div id="scores">
  <div class="team" id="you"><b id="runs" aria-label="runs for wickets"></b><span id="overs"></span></div>
  <div class="team" id="rival"><span class="name" id="match"></span><span id="target"></span></div>
  <div id="need"></div>
  <div id="over-row" hidden><span>this over</span><span id="this-over"></span></div>
</div>
<div class="hud" id="bottom">
  <div id="status" role="status" aria-live="polite"></div>
  <div class="buttons"><button id="team" type="button">change team</button><button id="mute" type="button" aria-pressed="false">sound on</button></div>
</div>
<button id="loft" type="button" aria-pressed="false" hidden>aerial</button>
<dialog id="picker" aria-labelledby="picker-title" aria-describedby="picker-new picker-hint">
  <h2 id="picker-title">Pick your team</h2>
  <p id="picker-new" hidden>Picking a team starts a new match.</p>
  <p id="picker-hint">You bat in their 1992 kit. The fielding side is drawn from the rest, in a kit unlike yours.</p>
  <div id="teams" role="group" aria-label="Teams"></div>
  <button id="picker-back" type="button" hidden>back to the match</button>
</dialog>
<script type="module" src="/src/main.js"></script>
</body>
</html>
